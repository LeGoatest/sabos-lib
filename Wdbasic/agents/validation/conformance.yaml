spec_version: "0.2.0"
kind: conformance
id: wdbasic.validation.conformance
authority_class: canonical_projection
canonical_sources: [../../docs/core-invariants/README.md, ../../docs/core-invariants/measurable-evidence/engineering-validation.md]
outcomes:
  pass: All applicable MUST requirements pass.
  fail: One or more applicable deterministic or confirmed semantic MUST requirements fail.
  not_applicable: The record does not apply to the evaluated artifact.
  requires_review: A material semantic or external question cannot be resolved deterministically.
  blocked: A required source or reference is missing or a non-compensatory invariant blocks conformance.
evaluation_order: [resolve_manifest_and_context, resolve_applicability, validate_schemas_and_references, evaluate_core_invariants, evaluate_selected_profile_and_page_type, evaluate_patterns_components_and_tokens, record_evidence_and_unresolved_review]
rules:
  warnings_do_not_override_errors: true
  failed_core_invariant_cannot_be_offset: true
  derived_record_cannot_self_promote: true
  canonical_source_conflict_blocks_projection: true
