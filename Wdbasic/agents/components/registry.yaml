      - hover
      - focus-visible
      - active
      - selected
      - expanded
      - collapsed
      - disabled
      - loading
      - empty
      - error
      - success
      - read-only
      - unavailable
      - pending
      - validating
      - invalid
      - conflict
      - rate-limited
      - expired
      - offline
      - uploading
      - processing
