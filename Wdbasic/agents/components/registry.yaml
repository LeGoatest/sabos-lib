    canonical_source: ../../docs/core-invariants/semantics/components/component-contracts.md
    governs:
      - reusable_server_rendered_components
      - form_controls
      - actions
      - custom_elements
      - composite_widgets
      - htmx_fragments
    required_record_fields:
