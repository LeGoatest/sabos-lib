name: Deploy cPanel Git checkout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cpanel-development
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy development
    runs-on: ubuntu-latest
    environment: development

    env:
      CPANEL_HOST: ${{ vars.CPANEL_HOST }}
      CPANEL_IP: ${{ vars.CPANEL_IP }}
      CPANEL_USER: ${{ vars.CPANEL_USER }}
      REPOSITORY_ROOT: ${{ vars.CPANEL_REPOSITORY_ROOT }}
      DEPLOY_BRANCH: dev
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "${CPANEL_HOST:-}" || { echo "CPANEL_HOST is missing." >&2; exit 1; }
          test -n "${CPANEL_USER:-}" || { echo "CPANEL_USER is missing." >&2; exit 1; }
          test -n "${REPOSITORY_ROOT:-}" || { echo "CPANEL_REPOSITORY_ROOT is missing." >&2; exit 1; }
          test -n "${DEPLOY_BRANCH:-}" || { echo "DEPLOY_BRANCH is missing." >&2; exit 1; }
          test -n "${CPANEL_API_TOKEN:-}" || { echo "CPANEL_API_TOKEN is missing." >&2; exit 1; }

          if printf '%s' "$CPANEL_HOST" | grep -Eq '(^https?://|/cpsess|/)'; then
            echo "CPANEL_HOST must be only the cPanel hostname or IP, without protocol, path, or cpsess URL." >&2
            exit 1
          fi

      - name: Verify cPanel repository
        shell: bash
        run: |
          set -euo pipefail

          curl_args=(
            --silent
            --show-error
            --fail-with-body
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}"
          )

          if [ -n "${CPANEL_IP:-}" ]; then
            curl_args+=(--resolve "${CPANEL_HOST}:2083:${CPANEL_IP}")
          fi

          response="$(curl "${curl_args[@]}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/retrieve")"

          RESPONSE="$response" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ['RESPONSE'])
          result = payload.get('result') if isinstance(payload.get('result'), dict) else payload

          if str(result.get('status')) != '1':
              raise SystemExit(
                  'cPanel VersionControl/retrieve failed: '
                  + str(result.get('errors') or result.get('messages') or result)
              )

          expected = os.environ['REPOSITORY_ROOT']
          data = result.get('data') or []
          if isinstance(data, dict):
              repositories = data.get('repositories') if isinstance(data.get('repositories'), list) else [data]
          elif isinstance(data, list):
              repositories = data
          else:
              repositories = []

          roots = []
          for repo in repositories:
              if not isinstance(repo, dict):
                  continue
              root = repo.get('repository_root') or repo.get('repository_root_path') or repo.get('root')
              if root:
                  roots.append(root)

          if expected not in roots:
              raise SystemExit(
                  f'cPanel API works, but {expected} is not listed as a managed Git repository. '
                  f'Found repository roots: {roots}'
              )
          PY

      - name: Update cPanel Git checkout
        shell: bash
        run: |
          set -euo pipefail

          curl_args=(
            --silent
            --show-error
            --fail-with-body
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}"
          )

          if [ -n "${CPANEL_IP:-}" ]; then
            curl_args+=(--resolve "${CPANEL_HOST}:2083:${CPANEL_IP}")
          fi

          response="$(curl "${curl_args[@]}" \
            --get \
            --data-urlencode "repository_root=${REPOSITORY_ROOT}" \
            --data-urlencode "branch=${DEPLOY_BRANCH}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/update")"

          RESPONSE="$response" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ['RESPONSE'])
          result = payload.get('result') if isinstance(payload.get('result'), dict) else payload

          if str(result.get('status')) != '1':
              raise SystemExit(
                  'cPanel VersionControl/update failed: '
                  + str(result.get('errors') or result.get('messages') or result)
              )

          print(
              'cPanel successfully updated '
              + os.environ['REPOSITORY_ROOT']
              + ' from '
              + os.environ['DEPLOY_BRANCH']
              + '.'
          )
          PY
