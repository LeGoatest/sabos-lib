name: One-time TCBasic restructure

on:
  push:
    branches:
      - agent/restructure-tcbasic-package

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/restructure-tcbasic-package
          fetch-depth: 0

      - name: Move package into TCBasic
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "Package already moved; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git mv src TCbasic/src
          git mv dist TCbasic/dist
          git mv tests TCbasic/tests
          git mv examples TCbasic/examples
          git mv .editorconfig TCbasic/.editorconfig
          git mv .gitignore TCbasic/.gitignore
          git mv package.json TCbasic/package.json
          git mv postcss.config.mjs TCbasic/postcss.config.mjs
          cp LICENSE TCbasic/LICENSE

          python <<'PY'
          import json
          from pathlib import Path

          package_path = Path("TCbasic/package.json")
          package = json.loads(package_path.read_text())
          package["files"] = [
              "src",
              "dist",
              "README.md",
              "CHANGELOG.md",
              "CONTRIBUTING.md",
              "TAILWIND_PATTERN.md",
              "architecture.md",
              "components.md",
              "customization.md",
              "migration-guide.md",
              "naming-conventions.md",
              "LICENSE",
              "postcss.config.mjs"
          ]
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          Path("README.md").write_text("""# Tailwind CSS Semantic Layer

This repository contains two independently organized systems.

## TCBasic

[`TCbasic/`](TCbasic/README.md) is the complete Tailwind CSS v4 semantic-layer package and documentation root.

```text
TCbasic/
├── src/
├── dist/
├── tests/
├── examples/
├── README.md
├── CHANGELOG.md
├── CONTRIBUTING.md
├── TAILWIND_PATTERN.md
├── architecture.md
├── components.md
├── customization.md
├── migration-guide.md
├── naming-conventions.md
├── .editorconfig
├── .gitignore
├── LICENSE
├── package.json
└── postcss.config.mjs
```

Run package commands from `TCbasic/`.

## WDBASIC

[`Wdbasic/`](Wdbasic/README.md) is the framework-independent web design, accessibility, security, validation, compliance, and implementation-contract system.

## Repository license

GPL-3.0-only. See [`LICENSE`](LICENSE).
""")

          Path("TCbasic/README.md").write_text("""# TCBasic: Tailwind CSS Semantic Layer

A reusable Tailwind CSS v4 architecture for teams that prefer short, meaningful HTML classes while keeping Tailwind utilities organized in CSS with `@theme`, `@layer`, and `@apply`.

## Goals

- Keep utility-heavy styling out of templates.
- Expose stable semantic classes such as `.button`, `.card`, and `.form-input`.
- Separate raw design tokens from semantic theme roles.
- Preserve Tailwind's responsive, state, and accessibility utilities.
- Remain framework-independent and compatible with server-rendered HTML, Laravel Blade, and HTMX.

## Package structure

```text
TCbasic/
├── src/          semantic CSS source
├── dist/         compiled distributions
├── tests/        structural and package-export tests
├── examples/     HTML, Laravel Blade, and HTMX examples
├── package.json
└── postcss.config.mjs
```

## Installation

```bash
npm install tailwindcss-semantic-layer tailwindcss @tailwindcss/cli
```

Use the source package when Tailwind should process and customize the layer:

```css
@import "tailwindcss-semantic-layer/source";
```

Use the prebuilt distribution when no Tailwind compilation is required:

```css
@import "tailwindcss-semantic-layer/dist";
```

Build a project stylesheet with the Tailwind CLI:

```bash
npx @tailwindcss/cli -i ./input.css -o ./public/app.css --watch
```

## Usage

```html
<a class="button button-primary" href="/estimate">Request an estimate</a>

<article class="card card-interactive">
  <div class="card-body layout-stack">
    <span class="badge badge-info">Featured</span>
    <h2 class="card-title">Semantic components</h2>
    <p class="card-description">Templates stay readable while Tailwind remains the implementation layer.</p>
  </div>
</article>
```

## Architecture

```text
src/
├── foundation/  tokens, theme mapping, reset, typography, accessibility
├── elements/    semantic element treatments
├── layout/      reusable spatial primitives
├── components/  interface objects and variants
├── patterns/    larger component compositions
├── states/      loading, empty, error, success, disabled
└── utilities/   intentionally limited escape hatches
```

The import graph is defined in [`src/index.css`](src/index.css). Raw values live in [`src/foundation/tokens.css`](src/foundation/tokens.css); [`src/foundation/theme.css`](src/foundation/theme.css) maps those values into Tailwind theme namespaces.

## Customization

```css
@import "tailwindcss-semantic-layer/source";

:root {
  --semantic-color-primary: oklch(45% 0.17 255);
  --semantic-color-primary-hover: oklch(38% 0.16 255);
  --semantic-color-accent: oklch(78% 0.16 75);
  --semantic-radius-card: 1rem;
}
```

See [`customization.md`](customization.md).

## Class model

| Category | Prefix or form | Examples |
| --- | --- | --- |
| Layout primitive | `layout-` | `.layout-container`, `.layout-stack` |
| Element treatment | `element-` | `.element-link`, `.element-heading` |
| Reusable component | semantic noun | `.button`, `.card`, `.form-input` |
| Component variant | noun + modifier | `.button-primary`, `.card-interactive` |
| Composition pattern | `pattern-` | `.pattern-hero`, `.pattern-feature-grid` |
| State | `is-` / `has-` | `.is-loading`, `.is-disabled`, `.has-error` |
| Limited utility | `util-` | `.util-content-narrow`, `.util-text-balance` |

## Examples

- [`examples/basic-html/`](examples/basic-html/)
- [`examples/laravel-blade/`](examples/laravel-blade/)
- [`examples/htmx/`](examples/htmx/)

## Documentation

- [`TAILWIND_PATTERN.md`](TAILWIND_PATTERN.md)
- [`architecture.md`](architecture.md)
- [`naming-conventions.md`](naming-conventions.md)
- [`customization.md`](customization.md)
- [`migration-guide.md`](migration-guide.md)
- [`components.md`](components.md)
- [`CHANGELOG.md`](CHANGELOG.md)
- [`CONTRIBUTING.md`](CONTRIBUTING.md)

WDBASIC remains a separate standards and implementation-contract layer under [`../Wdbasic/`](../Wdbasic/); the package does not require WDBASIC-specific class names.

## Development

Run these commands from `TCbasic/`:

```bash
npm install
npm test
npm run build
npm run build:example
```

`npm run build` writes the readable and minified distributions under [`dist/`](dist/). The test suite verifies imports, package exports, naming boundaries, and committed browser CSS.

## Releases

A semantic version tag such as `v0.1.0` triggers the repository release workflow. The tag must match [`package.json`](package.json). The workflow runs from `TCbasic/`, rebuilds `dist/`, and attaches the package archive and both CSS distributions to the GitHub release.

## License

GPL-3.0-only. See [`LICENSE`](LICENSE).
""")

          changelog = Path("TCbasic/CHANGELOG.md")
          text = changelog.read_text()
          marker = "### Changed\n\n"
          entry = "- Moved the complete Tailwind package implementation and configuration into `TCbasic/`, making it the package root.\n"
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
          changelog.write_text(text)

          Path(".github/CONTRIBUTING.md").write_text("""# Contributing

The canonical Tailwind CSS contribution guide is [`../TCbasic/CONTRIBUTING.md`](../TCbasic/CONTRIBUTING.md).

Before opening a pull request:

1. Run Tailwind package commands from `TCbasic/`.
2. Keep additions framework-independent unless they belong under `TCbasic/examples/`.
3. Put raw values in `TCbasic/src/foundation/tokens.css` and semantic Tailwind mappings in `TCbasic/src/foundation/theme.css`.
4. Prefer reusable nouns over page-specific or visual class names.
5. Preserve semantic HTML, keyboard operation, visible focus, reduced motion, and no-JavaScript behavior.
6. Add or update tests, TCBasic documentation, examples, and `TCbasic/CHANGELOG.md`.
7. Run `npm test` and `npm run build` from `TCbasic/`.

Do not commit changes to `TCbasic/dist/` unless they were generated from the same source revision.
""")

          Path(".github/workflows/build.yml").write_text("""name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TCBasic
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run structural tests
        run: npm test

      - name: Build distributable CSS
        run: npm run build

      - name: Build basic HTML example
        run: npm run build:example

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semantic-layer-css
          path: |
            TCBasic/dist/semantic-layer.css
            TCBasic/dist/semantic-layer.min.css
          if-no-files-found: error
""".replace("TCBasic", "TCbasic"))

          Path(".github/workflows/release.yml").write_text("""name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: TCBasic
        run: npm install --no-audit --no-fund

      - name: Test and build
        working-directory: TCBasic
        run: npm run check

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./TCBasic/package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Package TCBasic release files
        shell: bash
        run: |
          git archive \
            --format=tar.gz \
            --prefix="tailwindcss-semantic-layer-${GITHUB_REF_NAME}/" \
            --output="tailwindcss-semantic-layer-${GITHUB_REF_NAME}.tar.gz" \
            "${GITHUB_SHA}:TCBasic"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            TCBasic/dist/semantic-layer.css \
            TCBasic/dist/semantic-layer.min.css \
            tailwindcss-semantic-layer-${GITHUB_REF_NAME}.tar.gz
""".replace("TCBasic", "TCbasic"))
          PY

          rm .github/workflows/restructure-tcbasic.yml
          git add -A
          git commit -m "Restructure TCBasic as self-contained package"
          git push origin HEAD:agent/restructure-tcbasic-package
