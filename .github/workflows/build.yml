name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TCbasic
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run structural tests
        run: npm test

      - name: Build distributable CSS
        run: npm run build

      - name: Build basic HTML example
        run: npm run build:example

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semantic-layer-css
          path: |
            TCbasic/dist/semantic-layer.css
            TCbasic/dist/semantic-layer.min.css
          if-no-files-found: error
