name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: TCbasic
        run: npm install --no-audit --no-fund

      - name: Test and build
        working-directory: TCbasic
        run: npm run check

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./TCbasic/package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Package TCBasic release files
        shell: bash
        run: git archive --format=tar.gz --prefix="tailwindcss-semantic-layer-${GITHUB_REF_NAME}/" --output="tailwindcss-semantic-layer-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_SHA}:TCbasic"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes TCbasic/dist/semantic-layer.css TCbasic/dist/semantic-layer.min.css tailwindcss-semantic-layer-${GITHUB_REF_NAME}.tar.gz
