name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test and build
        run: npm run check

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Package release files
        run: |
          tar -czf tailwindcss-semantic-layer-${GITHUB_REF_NAME}.tar.gz \
            src dist docs examples README.md CHANGELOG.md LICENSE package.json postcss.config.mjs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            dist/semantic-layer.css \
            dist/semantic-layer.min.css \
            tailwindcss-semantic-layer-${GITHUB_REF_NAME}.tar.gz
