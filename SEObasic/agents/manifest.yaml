spec_version: "0.1.0"
kind: sabos.machine-interface
id: seobasic.agents
system:
  id: seobasic
  version: evolving
_authority_note: Machine-readable projection; canonical Markdown sources retain their existing authority.
authority:
  mode: projection
  canonical_entrypoint: ../README.md
  canonical_knowledge_index: ../docs/README.md
  conflict_resolution: canonical_sources_win
  binding_by_presence: false
projection:
  maintained: manual
  last_reviewed: 2026-08-14
  sync_required_when_sources_change: true
load_order:
  - standard.yaml
  - rules/invariants.yaml
  - evaluation/registry.yaml
  - strategies/registry.yaml
  - surfaces/registry.yaml
  - evidence/registry.yaml
  - measurement/registry.yaml
  - terminology/registry.yaml
  - validation/conformance.yaml
collections:
  rules: rules/invariants.yaml
  evaluation: evaluation/registry.yaml
  strategies: strategies/registry.yaml
  surfaces: surfaces/registry.yaml
  evidence: evidence/registry.yaml
  measurement: measurement/registry.yaml
  terminology: terminology/registry.yaml
schemas:
  manifest: schemas/manifest.schema.json
  record: schemas/record.schema.json
validation:
  conformance: validation/conformance.yaml
human_sources:
  root: ../README.md
  docs: ../docs/
  agent_instructions: ../AGENTS.md
