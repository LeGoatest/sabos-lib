  - {id: seobasic.source.classification, class: binding_invariant, path: ../../docs/invariants/evidence-classification.md}
  - {id: seobasic.source.metric-semantics, class: measurement_definition, path: ../../docs/measurement/contracts/metric-semantics.md}
  - {id: seobasic.source.google-eeat, class: platform_vendor_guidance, path: ../../docs/evidence/platform-guidance/google-eeat-and-helpful-content.md}
  - {id: seobasic.source.ai-platform-guidance, class: platform_vendor_guidance, path: ../../docs/evidence/platform-guidance/ai-search-platform-guidance.md}
  - {id: seobasic.source.generative-research, class: research_registry, path: ../../docs/evidence/research/answer-generative-discovery.md}
requirements:
